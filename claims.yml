- id: relapse-allage-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_relapse_all.png
  claim: All-age relapse incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 2.7% of the IBM median, at
    EIR 0.3, and within 0.8% from EIR 1 up
  status: pass
  note: >
    Relapses are counted over everyone and divided by the 0-100 band's
    population, which in the IBM leaves out its 0.7% over 100 and in fleet
    holds everyone, so fleet reads about 0.7% low by construction; most of its
    shortfall from EIR 1 up is that. Dividing both by the whole population
    wants the IBM rows re-summarised, at the vivax suite's next IBM run.

- id: hypnozoite-carriage-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_hyp_all.png
  claim: The share of people carrying hypnozoites tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 2.6% of the IBM median, at
    EIR 0.3, and within 0.7% from EIR 1 up
  status: pass
