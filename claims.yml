# The claims register.
#
# One entry per claim fleet makes about agreeing with malariasimulation. Each
# carries the criterion that decides it, the measured value, and a verdict.
#
# A criterion is drawn from the mechanism rather than from the observed number:
# "inside the IBM replicate band" because that band is the noise floor a
# deterministic model should land inside, not "at five of six EIRs" because five
# is what happened.
#
# Each claim asks whether fleet TRACKS the IBM: shape, direction, and agreement
# inside the IBM's own stochastic spread. A mean-field model and an
# individual-based one sit a few per cent apart for structural reasons, and that
# offset is noted against the claims it bears on rather than scored as one.
#
# "the IBM replicate band" is the median plus or minus 1.28 standard deviations
# across replicates -- the same 10-90% interval these criteria always named,
# read from every replicate instead of from two order statistics. Sample
# percentiles from twenty points are biased about 10% inward and their width
# drifts with the replicate count; this does not. fleetcheck::replicate_band()
# is the definition, and the figures draw it.
#
# Where a claim is about how a burden is distributed, it is scored on the cells
# carrying at least 5% of that burden. Bands holding almost no episodes say
# little about a distribution and carry the most replicate noise. tables.R
# prints any excluded cell that falls outside the band, so the exclusion is
# visible rather than silent, and the cost is stated against the claim.
#
# tier: what it costs to reproduce.
#   0  seconds, from committed summaries          anyone
#   1  under a minute, re-runs fleet only         anyone
#   2  ~2 h, re-runs both models                  anyone with ~10 cores
#   3  ~20 min, 63-country site files              4 cores, restricted inputs
#
# status: pass | fail | open | undeclared
#   open        criterion met but something material is unresolved
#   undeclared  no criterion exists yet; the claim is reported, not tested

- id: prevalence-eir
  figure: cmp_eir_pfpr_2_10.png
  claim: LM prevalence in 2-10 year olds tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 1.2% of the IBM median
  status: pass

- id: clinical-allage-eir
  figure: cmp_eir_clin_all.png
  claim: All-age clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 4 of 6; outside at EIR 50 (3.4% below the IBM median) and
    120 (4.7% below)
  status: fail
  note: >
    The departure is the default age grid's first-order discretisation error,
    and it grows with transmission: within 2.4% of the IBM at EIR 20 and below,
    3.4% and 4.7% low at EIR 50 and 120. Refined to 417 age groups fleet is
    within 0.1% of the IBM at EIR 20, 50 and 120 alike, so the model reaches the
    IBM and the default grid does not.

- id: clinical-under5-eir
  figure: cmp_eir_clin_0_5.png
  claim: Under-5 clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 4 of 6; outside at EIR 50 (2.5% below the IBM median) and
    120 (4.6% below)
  status: fail
  note: >
    fleet sits within 1.1% of the IBM median at EIR 20 and below. Above that
    the default age grid's discretisation puts it low; refined to 209 age groups
    it is within 1.1% at every EIR tested (EIR 20, 50 and 120), and at 417 within
    1.5%. See clinical-allage-eir.

- id: severe-allage-eir
  figure: cmp_eir_sev_all.png
  claim: All-age severe incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 6; outside at EIR 120 (8.2% below the IBM median)
  status: fail
  note: >
    fleet sits below the IBM at every EIR above 1, from 2.7% at EIR 3 to 8.2% at
    EIR 120, and the offset is the default age grid's discretisation: at EIR 20
    all-age severe incidence is 4.7% below the IBM median on the default 53
    groups, 1.8% below on 105, and on the IBM median to 0.04% on 209. At EIR 120
    it is 8.2% low on 53 groups and 1.0% on 209. Severe has the widest replicate
    spread here, which is what sets the twenty-replicate count; a band test
    cannot see an offset repeated at every point, which is why the offsets are
    given.

- id: age-profile-clinical
  figure: cmp_age_clin.png
  claim: The age distribution of clinical incidence tracks the IBM.
  criterion: >
    inside the IBM replicate band in every age band carrying at least 5% of
    clinical episodes, at EIR 3, 20 and 120
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 19 of 25 tested bands across the three EIRs, holding 94%
    of episodes; largest departure 3.37 replicate SD, in the 3-5 y band at EIR
    120
  status: fail
  note: >
    The bands outside are young children at high transmission, fleet low, and
    the cause is the default age grid's first-order discretisation error: over
    all 36 cells, 30 are inside at the default 53 groups, 35 at 105 and all 36
    at 209 (see clinical-allage-eir).
    40-60 y at EIR 20 is inside, at 1.27 SD; 4 of 20 held-out IBM replicates
    score at least as far from the other 19.
    What the burden floor costs: a defect confined to the oldest ages would not
    be caught here.
    Grid convergence is measured in validations/age-grid/; the held-out check
    is not yet reproduced by a script in this repository.

- id: age-profile-severe
  figure: cmp_age_sev.png
  claim: The age distribution of severe incidence tracks the IBM.
  criterion: >
    inside the IBM replicate band in every age band carrying at least 5% of
    severe episodes, at EIR 3, 20 and 120
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 16 of 16 tested bands across the three EIRs, holding 94%
    of episodes; largest departure 1.10 replicate SD, in the 3-5 y band at
    EIR 20
  status: pass
  note: >
    The burden floor is doing little here: no untested band is outside the
    band either. Most of what the floor excludes is above age 30, where the
    IBM's replicate spread is several times its median and agreement is not
    evidence of much. The severe age bands' replicate spread is wide enough to
    absorb the default grid's offset (see severe-allage-eir), so this claim
    holds where the all-age level does not.

- id: intervention-impact
  figure: cmp_int_impact.png
  claim: The modelled impact of each intervention matches the IBM.
  criterion: >
    outside the IBM replicate band in no greater a share of cells than the best
    held-out IBM replicate, over every intervention and outcome at EIR 3, 20 and
    120 (SMC in a seasonal setting, since it is a seasonal intervention)
  tier: 2
  evidence: validations/02-scenarios
  measured: fleet outside in 2.8% of 72 cells, against 9.7% for the closest of
    the twenty IBM replicates and 20.1% for the median one
  status: pass
  note: >
    The bar is taken from the IBM because at 72 cells a fixed one cannot be:
    a 1.28 SD band leaves a fifth of cells outside by construction, and no
    replicate is inside all 72. fleet is outside less often than any of the
    twenty.
    Where fleet does sit outside, the size is small in both senses. It is
    outside in two cells, bed nets on prevalence at EIR 20 and 120. The worse is
    EIR 120, where the IBM's bed nets cut PfPR(2-10) by 27.5% and fleet's by
    25.5%: 2.0 percentage points of the reduction, 7.4% of the effect, the mark
    of population-averaged nets, which lose the correlation of each person's
    protection across bites. The typical gap does not grow with transmission --
    a median of 0.36, 0.32 and 0.54 percentage points at EIR 3, 20 and 120.
    Impact is a ratio of two runs sharing an age grid, so grid discretisation
    divides out: on a grid twice as fine the worst excursion moves by less than
    0.1 point.
    SMC sends the clinical and detectable cases it treats through the treated
    state first, as the IBM does, so prevalence in the dosed band falls over
    the Tr stay rather than overnight; its protection is complete while it
    lasts, where the IBM's is partial and fades.
    Perennial chemoprevention is the one intervention whose delivery the models
    cannot share. The IBM doses each child on reaching a dose age; fleet
    approximates that as monthly pulses over a 30-day band, which doses 8 to 21
    days late and overstates the infant benefit by about a tenth.
    The window is the three years after deployment. Over the arms' last three
    years PMC raises severe incidence, fleet by -1.2% at EIR 3 to +7.0% at EIR
    120: the rebound of delayed immunity, pushing severe disease from infancy
    into the second and third years of life. The IBM shows the same sign at EIR
    120.

- id: real-settings-correlation
  figure: cmp_core_sites.png
  claim: Agreement holds across real transmission settings, not just synthetic scenarios.
  criterion: r > 0.95 and |slope - 1| < 0.10 on both clinical and severe incidence
  tier: 3
  evidence: validations/03-real-settings
  measured: clinical r 0.983 slope 0.966; severe r 0.957 slope 0.890, over
    451,008 sub-site-months in 1,392 sub-sites of 63 countries
  status: fail
  note: >
    r and slope test whether fleet tracks the IBM, not whether it sits on top
    of it. Pooled over every sub-site-month fleet runs 5.5% above the IBM on
    clinical incidence and 3.3% on severe.
    No single excess figure describes the level: clinical runs from +195% below
    pf EIR 0.1 to -3.9% at 120 and above, and severe from +154% to -9.0%. The
    severe slope falls outside the criterion because those two ends pull it the
    same way. At the low end, 18% of sub-sites sit below EIR 1, outside any
    tier-2 claim, and the excess there is not explained. At the high end, severe
    incidence 9% low is the default age grid's discretisation, which tier 2
    measures directly (severe-allage-eir: 8.2% low at EIR 120 on the default
    grid, 1.0% on a grid four times as fine).
    Guinea-Bissau is a separate failure: 18 sub-sites at +105% and r 0.642,
    against the 554 sub-sites elsewhere whose mean IBM incidence lies in the
    same range, at +10.6% and r 0.976. diagnose.R ranks every sub-site.
    fleet ran every one of the 1,392 sub-sites with P. falciparum transmission;
    none is dropped.
    Monthly, and P. falciparum only on both arms: annual means can hide a
    seasonal mismatch, and the shipped diagnostics carry vivax rows that
    inflate the baseline where pf transmission is low.

- id: population-age-structure
  figure: cmp_core_pop_age.png
  claim: The population age structure matches the IBM's.
  criterion: >
    inside the IBM replicate band in every age band below 60 years, on shares
    renormalised to the 0-60 population
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 11 of 11; largest departure 1.3% of the IBM median
  status: pass
  note: >
    The 0-60 restriction is a rendering convention, not a model difference:
    fleet's oldest group is absorbing and open-ended above 80, and a rendering
    band that reaches into it is given all of it, so fleet's 60-85 share is 41%
    higher by construction.
    Agreement at this level depends on the ageing rate being exponentially
    fitted, r = mu/expm1(mu*width), exact at the seed and an approximation
    under time-varying demography.

- id: speed
  figure: ~
  claim: fleet is fast enough to be worth using in place of the IBM.
  criterion: at least 10x faster than the IBM on the same scenario set
  tier: 2
  evidence: validations/02-scenarios
  measured: 140x on cost per simulated year; 19.9 CPU-hours for the IBM against 26 s for fleet
  status: pass
  note: >
    Each fleet figure is one complete run_simulation_ode() call -- inputs,
    seed, the run and its outputs -- on one core; the IBM's are its runs on a
    worker pool. One fleet run stands in for the IBM's twenty replicates of
    10,000 people, and its cost does not grow with the population.

- id: seed-stability
  figure: ~
  claim: An undisturbed run holds the equilibrium it was seeded at.
  criterion: PfPR(2-10) departs from its seeded value by less than 1% over 15 years at EIR 20
  tier: 1
  evidence: validations/01-seed-stability
  note: >
    The seed is malariaEquilibrium's continuous-time solution, not fleet's own
    fixed point on the daily clock, so the run moves off it and settles 0.31%
    below it. The claim is about prevalence: incidence relaxes further, under-5
    clinical incidence by -0.3% at EIR 1, +1.5% at EIR 20 and +6% at EIR 120,
    mostly within five years, so a comparison of incidence levels wants a
    burn-in (every tier-2 scenario has thirty years), as the IBM's does.
    validations/01-seed-stability/run.R reproduces the prevalence figures.
  measured: 0.36% maximum excursion; flat to 0.006% over the last five years
  status: pass

