- id: speed-pv
  parasite: vivax
  figure: ~
  table: tab_speed_pv.md
  claim: fleet is fast enough to be worth using in place of the IBM.
  criterion: >
    at least 10x faster per simulated year than one IBM run of 10,000 people,
    each timed alone on one core, at EIR 1, 3 and 10, with nothing deployed and
    with a seasonal programme
  tier: 2
  evidence: validations/02-scenarios
  measured: 0.6x to 1.7x per simulated year at 10,000 people, 2.1x to 4.7x at
    50,000; fleet 0.83 to 2.1 s per simulated year, the IBM 1.2 to 1.6 s at
    10,000 people
  status: fail
  note: >
    Each run in the table starts from set_equilibrium()'s seed and is timed
    alone, start-up apart. Each fleet figure is one complete
    run_simulation_ode() call, the fastest of two. With nothing deployed a
    vivax fleet run costs 10 to 12 times a falciparum one, for the hypnozoite
    dimension and the within-cell immunity spread, and the programme more than
    doubles it, mostly through primaquine radical cure's liver-stage levels.
    The IBM costs a little less for vivax than for falciparum. So at 10,000
    people fleet is 1.4 to 1.7 times faster with nothing deployed, and slower
    than the IBM under the programme. Its cost does not grow with the
    population, so at 50,000 people it is 2.1 to 4.7 times faster. One fleet
    run also stands in for the twenty replicates an IBM comparison needs:
    across the vivax scenario suite, whose IBM runs share a worker pool, the
    IBM takes 9.5 CPU-hours and fleet 26 minutes.

- id: seed-stability-pv
  parasite: vivax
  figure: ~
  claim: An undisturbed run settles to a steady state, off the equilibrium it was seeded at, as the IBM's does.
  criterion: PvPR(2-10) flat to under 1% over the last five of 30 years, at EIR 0.3, 1, 3 and 10
  tier: 1
  evidence: validations/01-seed-stability
  measured: flat to 0.27% at EIR 0.3, 0.09% at 1, 0.007% at 3 and 0.001% at 10;
    settling 15%, 10%, 6% and 3% above the seeded PvPR
  status: pass
  note: >
    The criterion is settling rather than holding the seed, because the vivax
    seed is neither model's fixed point. malariaEquilibriumVivax solves each age,
    heterogeneity and batch cell with one immunity value, where both models
    build up a spread of immunity within a cell from the first day, and the
    vivax immunity curves are steep enough for that to move everything: over
    the four EIRs fleet's clinical incidence settles 16 to 22% above the seed
    and its realised EIR 5 to 18% above init_EIR, PvPR overshooting first at the
    lowest EIRs (21.5% at EIR 0.3). The IBM moves as far: in the tier-2 runs its
    realised EIR ends 18%, 13% and 8% above init_EIR at EIR 0.3, 1 and 3,
    against fleet's 18%, 14% and 9%. The control says why: with
    immunity_spread = FALSE fleet holds its seed at EIR 3 to within 1.3%. So
    every vivax comparison is made after a 30-year burn-in in both models --
    long enough at EIR 0.3, where settling takes over two decades -- and a vivax
    run started from set_equilibrium() wants one.
    validations/01-seed-stability/run.R reproduces the figures.

