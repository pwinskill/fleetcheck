# The claims register.
#
# One entry per claim fleet makes about agreeing with malariasimulation. Each
# carries the criterion that decides it, the measured value, and a verdict.
#
# A criterion is drawn from the mechanism rather than from the observed number:
# "inside the IBM replicate band" because that band is the noise floor a
# deterministic model should land inside, not "at five of six EIRs" because five
# is what happened.
#
# Each claim asks whether fleet TRACKS the IBM: shape, direction, and agreement
# inside the IBM's own stochastic spread. A mean-field model and an
# individual-based one sit a few per cent apart for structural reasons, and that
# offset is noted against the claims it bears on rather than scored as one.
#
# tier: what it costs to reproduce.
#   0  seconds, from committed summaries          anyone
#   1  ~2 min, re-runs fleet only                 anyone
#   2  ~2 h, re-runs both models                  anyone with ~10 cores
#   3  ~40 min, 63-country site files              ~10 cores, restricted inputs
#
# status: pass | fail | open | undeclared
#   open        criterion met but something material is unresolved
#   undeclared  no criterion exists yet; the claim is reported, not tested

- id: prevalence-eir
  figure: cmp_eir_pfpr_2_10.png
  claim: LM prevalence in 2-10 year olds tracks the IBM across transmission intensity.
  criterion: inside the IBM 10-90% replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 0.94% of the IBM median
  status: pass

