name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 0: seconds, and the part that has to be right before anything else is
  # worth reading. The metrics are unit-tested, the register must parse, every
  # unresolved claim must explain itself, and the rendered scoreboard must match
  # the register it was generated from.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # hard dependencies only. malariasimulation and fleet are Suggests and
          # are GitHub remotes that compile from source; nothing in this job
          # loads either, and installing them would mean an unrelated build
          # failure could turn the register red.
          dependencies: '"hard"'
          extra-packages: any::testthat, any::withr, any::pkgload, any::devtools

      - name: Tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: The rendered scoreboard matches claims.yml
        run: Rscript report/make_scoreboard.R --check

      - name: No claim has regressed
        # Two claims fail today and are tolerated by name.
        #
        # age-profile-clinical is NOT age-grid discretisation. Refining the grid
        # moves it the wrong way -- 35 of 36 bands inside at the default 53
        # groups, 32 at 105, 27 at 209 -- because the default grid's
        # discretisation error partly cancels the mean-field one, and refining
        # exposes a larger departure in young children (max |z| 4.2 at 2-3y,
        # EIR 120). Nor is it the biting-heterogeneity quadrature: the IBM uses
        # the same five Gauss-Hermite nodes, so raising fleet's node count makes
        # it model a different population rather than converge.
        #
        # intervention-impact fails only at the top of the transmission range,
        # and passes outright at EIR 3. The register carries the breakdown.
        #
        # check_claims() refuses an allow_fail entry with no explanatory note, so
        # tolerating a failure always costs a written reason, and a THIRD failure
        # still turns this red. Remove an id when its claim passes; do not add
        # one without writing the note first.
        run: |
          Rscript -e 'pkgload::load_all(quiet = TRUE);
            check_claims(allow_fail = c("age-profile-clinical", "intervention-impact"))'
