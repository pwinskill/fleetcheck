name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 0: seconds, and the part that has to be right before anything else is
  # worth reading. The metrics are unit-tested, the register must parse, every
  # unresolved claim must explain itself, and the rendered scoreboard must match
  # the register it was generated from.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # hard dependencies only. malariasimulation and fleet are Suggests and
          # are GitHub remotes that compile from source; nothing in this job
          # loads either, and installing them would mean an unrelated build
          # failure could turn the register red.
          dependencies: '"hard"'
          extra-packages: any::testthat, any::withr, any::pkgload, any::devtools

      - name: Tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: The rendered scoreboard matches claims.yml
        run: Rscript report/make_scoreboard.R --check

      - name: No claim has regressed
        # Two claims fail today and are tolerated by name. Both are age-grid
        # discretisation rather than model discrepancy, both are documented in
        # the register, and check_claims() refuses an allow_fail entry that has
        # no explanatory note -- so tolerating a failure always costs a written
        # reason, and a THIRD failure still turns this red.
        #
        # Remove an id from this list when its claim passes. Do not add one
        # without writing the note first.
        run: |
          Rscript -e 'pkgload::load_all(quiet = TRUE);
            check_claims(allow_fail = c("age-profile-clinical",
                                        "population-age-structure"))'
