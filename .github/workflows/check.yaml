name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 0: seconds, and the part that has to be right before anything else is
  # worth reading. The metrics are unit-tested, the register must parse, every
  # unresolved claim must explain itself, and the rendered scoreboard must match
  # the register it was generated from.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # hard dependencies only. malariasimulation and fleet are Suggests and
          # are GitHub remotes that compile from source; nothing in this job
          # loads either, and installing them would mean an unrelated build
          # failure could turn the register red.
          dependencies: '"hard"'
          extra-packages: any::testthat, any::withr, any::pkgload, any::devtools

      - name: Tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: The rendered scoreboard matches claims.yml
        run: Rscript report/make_scoreboard.R --check

      - name: No claim has regressed
        # One claim fails today and is tolerated by name. It is NOT simply age-
        # grid discretisation: refining the grid takes it from 28 of 36 bands to
        # 30 and then makes it worse again, because the departure converges to a
        # +4 to +7% excess in young children that no resolution removes. What is
        # left is the mean-field approximation itself, and the register says so.
        # check_claims() refuses an allow_fail entry with no explanatory note, so
        # tolerating a failure always costs a written reason, and a SECOND
        # failure still turns this red.
        #
        # population-age-structure was on this list until the ageing rate was
        # exponentially fitted, which fixed it outright. Remove an id when its
        # claim passes. Do not add one without writing the note first.
        run: |
          Rscript -e 'pkgload::load_all(quiet = TRUE);
            check_claims(allow_fail = "age-profile-clinical")'
