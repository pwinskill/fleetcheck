name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard dependencies only, for the same reason check.yaml gives:
          # malariasimulation and fleet are Suggests, are GitHub remotes that
          # compile from source, and nothing the site needs loads either. The
          # articles read claims.yml and embed figures that are committed as
          # PNGs; no model is run at build time. Installing the Suggests would
          # mean an unrelated build failure could take the site down.
          dependencies: '"hard"'
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, local::.
          needs: website

      - name: The rendered copies match the register
        # the pages read the register, and a deploy of a stale copy would
        # publish verdicts the register no longer holds
        run: Rscript report/make_scoreboard.R --check

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
