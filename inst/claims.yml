# The claims register.
#
# One entry per claim fleet makes about agreeing with malariasimulation. Each
# carries the criterion that decides it, the measured value, and a verdict.
#
# The criteria were written RETROSPECTIVELY at first pass, which is weaker than
# declaring them in advance, and they are marked `declared: retrospective` where
# that is so. They are drawn from the mechanism rather than from the observed
# number -- "inside the IBM replicate band" because that band is the noise floor
# a deterministic model should land inside, not "at five of six EIRs" because
# five is what happened. Any claim added from here on declares its criterion
# before the run, and says `declared: in-advance`.
#
# tier: what it costs to reproduce.
#   0  seconds, from committed summaries          anyone
#   1  ~2 min, re-runs fleet only                 anyone
#   2  ~25 min, re-runs both models               anyone with ~10 cores
#   3  ~7 h, 63-country site files                cluster, restricted inputs
#
# status: pass | fail | open | undeclared
#   open        criterion met but something material is unresolved
#   undeclared  no criterion exists yet; the claim is reported, not tested

- id: seed-stability
  figure: ~
  claim: An undisturbed run holds the equilibrium it was seeded at.
  criterion: PfPR(2-10) departs from its seeded value by less than 1% over 15 years at EIR 20
  declared: retrospective
  tier: 1
  evidence: validations/01-seed-stability
  measured: 0.28% maximum excursion; flat to 0.02% over the last five years
  status: pass

- id: prevalence-eir
  figure: cmp_eir_pfpr_2_10.png
  claim: LM prevalence in 2-10 year olds tracks the IBM across transmission intensity.
  criterion: inside the IBM 10-90% replicate band at every EIR on the grid
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 0.94% of the IBM median
  status: pass

- id: clinical-under5-eir
  figure: cmp_eir_clin_0_5.png
  claim: Under-5 clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM 10-90% replicate band at every EIR on the grid
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6
  status: pass
  note: >
    Was open at ten replicates, where it sat 0.1% outside the upper edge at EIR 120. The edge, not the model, was wrong: see the note on
    severe-allage-eir. fleet runs consistently a little above the IBM median here, +0.7% to +2.0% across the grid.

- id: clinical-allage-eir
  figure: cmp_eir_clin_all.png
  claim: All-age clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM 10-90% replicate band at every EIR on the grid
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6
  status: pass
  note: >
    Was open at ten replicates, 0.24% outside the lower edge at EIR 50.

- id: severe-allage-eir
  figure: cmp_eir_sev_all.png
  claim: All-age severe incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM 10-90% replicate band at every EIR on the grid
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6
  status: pass
  note: >
    This FAILED at ten replicates, 4 of 6, and the change is in the yardstick rather than in fleet.
    Ten replicates estimate a 10-90% band too NARROW, because a small sample rarely reaches into the tails, so the interior percentiles come in tight. Doubling to twenty widened the severe band from 13.9% to 15.4% of the median and the claim moved inside it.
    The criterion is met. It is not the same as saying the discrepancy went away: see severe-allage-bias, which is what the band test cannot see.

- id: severe-allage-bias
  claim: All-age severe incidence carries no systematic offset against the IBM.
  figure: cmp_eir_sev_all.png
  criterion: NONE DECLARED
  declared: none
  tier: 2
  evidence: validations/02-scenarios
  measured: fleet sits below the IBM median at all six EIRs, by 0.1% 2.7% 3.1% 2.8% 4.0% 3.5% at EIR 1 3 10 20 50 120
  status: undeclared
  note: >
    Added after the twenty-replicate run, because severe-allage-eir passing is
    not the same as the discrepancy being gone, and on its own it reads as
    though it were.
    A band test asks whether one number lands inside a spread. It is blind to a
    small offset repeated every time: severe incidence has the widest replicate
    spread of any outcome here, 15.4% of the median, so a 3% deficit sits
    comfortably inside the band while being present at every EIR with the same
    sign. Six of six the same sign is not evidence of no bias; under a coin-flip
    it would happen once in thirty-two runs.
    The EIR 1 point is the exception worth naming: 0.1% is not a deficit, it is
    a rounding difference, and the offset only establishes itself from EIR 3
    upwards. So the substantive statement is 2.7-4.0% at the five EIRs from 3
    up, not 3% across the whole grid.
    The mechanism is known and derived in fleet's model vignette, section B.3.
    What is missing is a criterion. It should be stated on the median, not the
    band -- something of the form "within x% of the IBM median at every EIR" --
    and x has to come from an argument about what the model is for rather than
    from the number that happens to be there.

- id: age-structure
  figure: cmp_core_age.png
  claim: The age profile of incidence tracks the IBM.
  criterion: NONE DECLARED
  declared: none
  tier: 2
  evidence: validations/02-scenarios
  measured: clinical within -11.5% to +11.8% under age 20; severe -21% to +11%, and -16% to -21% in three of the four 5-20 year bands
  status: undeclared
  note: >
    Reported but not tested. A criterion here has to say something about narrow
    age bands specifically, where the severe deficit concentrates, and about
    what tolerance a band-level comparison deserves given replicate noise grows
    as the bands narrow.

- id: intervention-impact
  figure: cmp_int_impact.png
  claim: The modelled impact of each intervention matches the IBM.
  criterion: within 0.6 percentage points of the IBM replicate band on every outcome
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: inside the band on 18 of 20; worst excursion 0.36 percentage points
  status: pass

- id: real-settings-correlation
  figure: cmp_core_sites.png
  claim: Agreement holds across real transmission settings, not just synthetic scenarios.
  criterion: r > 0.95 and |slope - 1| < 0.10 on both clinical and severe incidence
  declared: retrospective
  tier: 3
  evidence: validations/03-real-settings
  measured: clinical r 0.982 slope 0.997; severe r 0.958 slope 0.946
  status: pass

- id: real-settings-bias
  figure: cmp_core_sites.png
  claim: fleet carries no systematic bias across real transmission settings.
  criterion: NONE DECLARED
  declared: none
  tier: 3
  evidence: validations/03-real-settings
  measured: +8.7% on clinical, +8.8% on severe, across 1391 sub-sites in 63 countries
  status: undeclared
  note: >
    This is the gap the register exists to expose. The excess is reported
    honestly everywhere it appears, but nothing has ever said what magnitude
    would be too much, so it has been carried as a known curiosity rather than
    as a failing test. Declaring a criterion forces the question: is 9%
    acceptable for the uses fleet is intended for, and if so on what argument?
    Until that is answered this claim is untested, not passed.

- id: speed
  figure: ~
  claim: fleet is fast enough to be worth using in place of the IBM.
  criterion: at least 10x faster than the IBM on the same scenario set
  declared: retrospective
  tier: 2
  evidence: validations/02-scenarios
  measured: 19x on cost per simulated year; 10.7 CPU-hours for the IBM against 103 s for fleet
  status: pass
