# The claims register.
#
# One entry per claim fleet makes about agreeing with malariasimulation. Each
# carries the criterion that decides it, the measured value, and a verdict.
#
# A criterion is drawn from the mechanism rather than from the observed number:
# "inside the IBM replicate band" because that band is the noise floor a
# deterministic model should land inside, not "at five of six EIRs" because five
# is what happened.
#
# Each claim asks whether fleet TRACKS the IBM: shape, direction, and agreement
# inside the IBM's own stochastic spread. A mean-field model and an
# individual-based one sit a few per cent apart for structural reasons, and that
# offset is noted against the claims it bears on rather than scored as one.
#
# "the IBM replicate band" is the median plus or minus 1.28 standard deviations
# across replicates -- the same 10-90% interval these criteria always named,
# read from every replicate instead of from two order statistics. Sample
# percentiles from twenty points are biased about 10% inward and their width
# drifts with the replicate count; this does not. fleetcheck::replicate_band()
# is the definition, and the figures draw it.
#
# Where a claim is about how a burden is distributed, it is scored on the cells
# carrying at least 5% of that burden. Bands holding almost no episodes say
# little about a distribution and carry the most replicate noise. tables.R
# prints any excluded cell that falls outside the band, so the exclusion is
# visible rather than silent, and the cost is stated against the claim.
#
# tier: what it costs to reproduce.
#   0  seconds, from committed summaries          anyone
#   1  minutes, re-runs fleet only                anyone
#   2  ~2 h, re-runs both models                  anyone with ~10 cores
#   3  ~20 min, 63-country site files              4 cores, restricted inputs
#
# status: pass | fail | open | undeclared
#   open        criterion met but something material is unresolved
#   undeclared  no criterion exists yet; the claim is reported, not tested

- id: prevalence-eir
  figure: cmp_eir_pfpr_2_10.png
  claim: LM prevalence in 2-10 year olds tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 1.0% of the IBM median, at EIR 3
  status: pass

- id: clinical-allage-eir
  figure: cmp_eir_clin_all.png
  claim: All-age clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 1.9% of the IBM median, at EIR 1,
    and within 0.9% from EIR 10 up
  status: pass
  note: >
    The age grid's first-order discretisation error grows with transmission,
    and the default 209 groups hold it to under 1% of the IBM here. A coarser
    grid runs low where transmission is high: default_age_lower(n_group = 53),
    at a quarter of the cost, puts fleet 3.4% and 4.7% below the IBM median at
    EIR 50 and 120, outside the band. validations/age-grid measures the grid's
    share.

- id: clinical-under5-eir
  figure: cmp_eir_clin_0_5.png
  claim: Under-5 clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 1.0% of the IBM median
  status: pass
  note: >
    On 53 age groups fleet runs 2.5% and 4.6% below the IBM median at EIR 50 and
    120, outside the band; see clinical-allage-eir.

- id: severe-allage-eir
  figure: cmp_eir_sev_all.png
  claim: All-age severe incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 6 of 6; largest departure 2.0% of the IBM median, at EIR 1,
    and within 1.3% from EIR 3 up
  status: pass
  note: >
    Severe incidence is where the age grid shows most: theta sits on the convex
    tail of its Hill function from early childhood, and a group's severe
    incidence is evaluated at its mean immunity, so the error is first order in
    the group width. On the default 209 groups fleet sits within 1.3% of the IBM
    median from EIR 3 to 120, with no offset repeated at every point; on 53 groups it runs
    below the IBM at every EIR above 1, from 2.7% at EIR 3 to 8.2% at EIR 120.
    Severe has the widest replicate spread here, which is what sets the
    twenty-replicate count; a band test cannot see an offset repeated at every
    point, which is why the offsets are given.

- id: age-profile-clinical
  figure: cmp_age_clin.png
  claim: The age distribution of clinical incidence tracks the IBM.
  criterion: >
    inside the IBM replicate band in every age band carrying at least 5% of
    clinical episodes, at EIR 3, 20 and 120
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 25 of 25 tested bands across the three EIRs, holding 94%
    of episodes; largest departure 0.93 replicate SD, in the 3-5 y band at EIR
    120
  status: pass
  note: >
    No untested band is outside either. On 53 age groups 6 of the tested bands
    fall outside, young children at high transmission with fleet low: the grid's
    first-order discretisation error, which validations/age-grid measures (see
    clinical-allage-eir).
    What the burden floor costs: a defect confined to the oldest ages would not
    be caught here.

- id: age-profile-severe
  figure: cmp_age_sev.png
  claim: The age distribution of severe incidence tracks the IBM.
  criterion: >
    inside the IBM replicate band in every age band carrying at least 5% of
    severe episodes, at EIR 3, 20 and 120
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 16 of 16 tested bands across the three EIRs, holding 94%
    of episodes; largest departure 0.78 replicate SD, in the 1-2 y band at
    EIR 20
  status: pass
  note: >
    The burden floor is doing little here: no untested band is outside the
    band either. Most of what the floor excludes is above age 30, where the
    IBM's replicate spread is several times its median and agreement is not
    evidence of much.

- id: intervention-impact
  figure: cmp_int_impact.png
  claim: The modelled impact of each intervention matches the IBM.
  criterion: >
    outside the IBM replicate band in no greater a share of cells than the best
    held-out IBM replicate, over every intervention and outcome at EIR 3, 20 and
    120 (SMC in a seasonal setting, since it is a seasonal intervention)
  tier: 2
  evidence: validations/02-scenarios
  measured: fleet outside in 4.2% of 72 cells, against 9.7% for the closest of
    the twenty IBM replicates and 20.1% for the median one
  status: pass
  note: >
    The bar is taken from the IBM because at 72 cells a fixed one cannot be:
    a 1.28 SD band leaves a fifth of cells outside by construction, and no
    replicate is inside all 72. fleet is outside less often than any of the
    twenty.
    Where fleet does sit outside, the size is small in both senses. It is
    outside in three cells, all bed nets: on prevalence at EIR 20 and 120, and
    on all-age clinical incidence at EIR 120, that one by 0.08 points. The
    worst is prevalence at EIR 120, where the IBM's bed nets cut PfPR(2-10) by
    27.5% and fleet's by 25.3%: 2.1 percentage points of the reduction, 7.8% of
    the effect, the mark of population-averaged nets, which lose the
    correlation of each person's protection across bites. The typical gap does
    not grow with transmission -- a median of 0.39, 0.37 and 0.49 percentage
    points at EIR 3, 20 and 120.
    Impact is a ratio of two runs sharing an age grid, so grid discretisation
    largely divides out: four times the groups, 53 to 209, moved the worst
    excursion by 0.11 points.
    SMC sends the clinical and detectable cases it treats through the treated
    state first, as the IBM does, so prevalence in the dosed band falls over
    the Tr stay rather than overnight; its protection is complete while it
    lasts, where the IBM's is partial and fades.
    Perennial chemoprevention is the one intervention whose delivery the models
    cannot share. The IBM doses each child on reaching a dose age; fleet
    approximates that as monthly pulses over a 30-day band, which doses 8 to 21
    days late and overstates the infant benefit by about a tenth.
    The window is the three years after deployment. Over the arms' last three
    years, against the three before deployment, PMC changes all-age severe
    incidence in fleet by -1.1% at EIR 3, +1.7% at EIR 20 and +7.6% at EIR 120:
    the rebound of delayed immunity, pushing severe disease from infancy into
    the second and third years of life. The IBM's medians have the same sign at
    all three (-5.2%, +3.1%, +4.2%), inside replicate bands too wide to say
    more.

- id: real-settings-correlation
  figure: cmp_core_sites.png
  claim: Agreement holds across real transmission settings, not just synthetic scenarios.
  criterion: r > 0.95 and |slope - 1| < 0.10 on both clinical and severe incidence
  tier: 3
  evidence: validations/03-real-settings
  measured: clinical r 0.983 slope 0.966; severe r 0.957 slope 0.890, over
    451,008 sub-site-months in 1,392 sub-sites of 63 countries
  status: fail
  note: >
    r and slope test whether fleet tracks the IBM, not whether it sits on top
    of it. Pooled over every sub-site-month fleet runs 5.5% above the IBM on
    clinical incidence and 3.3% on severe.
    No single excess figure describes the level: clinical runs from +195% below
    pf EIR 0.1 to -3.9% at 120 and above, and severe from +154% to -9.0%. The
    severe slope falls outside the criterion because those two ends pull it the
    same way. At the low end, 18% of sub-sites sit below EIR 1, outside any
    tier-2 claim, and the excess there is not explained. At the high end, severe
    incidence 9% low is the default age grid's discretisation, which tier 2
    measures directly (severe-allage-eir: 8.2% low at EIR 120 on the default
    grid, 1.0% on a grid four times as fine).
    Guinea-Bissau is a separate failure: 18 sub-sites at +105% and r 0.642,
    against the 554 sub-sites elsewhere whose mean IBM incidence lies in the
    same range, at +10.6% and r 0.976. diagnose.R ranks every sub-site.
    fleet ran every one of the 1,392 sub-sites with P. falciparum transmission;
    none is dropped.
    Monthly, and P. falciparum only on both arms: annual means can hide a
    seasonal mismatch, and the shipped diagnostics carry vivax rows that
    inflate the baseline where pf transmission is low.

- id: population-age-structure
  figure: cmp_core_pop_age.png
  claim: The population age structure matches the IBM's.
  criterion: >
    inside the IBM replicate band in every age band below 60 years, on shares
    renormalised to the 0-60 population
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 11 of 11; largest departure 1.3% of the IBM median
  status: pass
  note: >
    The 0-60 restriction is a rendering convention, not a model difference:
    fleet's oldest group is absorbing and open-ended above 80, and a rendering
    band that reaches into it is given all of it, so fleet's 60-85 share is 41%
    higher by construction.
    Agreement at this level depends on the ageing rate being exponentially
    fitted, r = mu/expm1(mu*width), exact at the seed and an approximation
    under time-varying demography.

- id: speed
  figure: ~
  claim: fleet is fast enough to be worth using in place of the IBM.
  criterion: at least 10x faster than the IBM on the same scenario set
  tier: 2
  evidence: validations/02-scenarios
  measured: 24x on cost per simulated year; 19.9 CPU-hours for the IBM against 146 s for fleet
  status: pass
  note: >
    Each fleet figure is one complete run_simulation_ode() call -- inputs,
    seed, the run and its outputs -- on one core; the IBM's are its runs on a
    worker pool. One fleet run stands in for the IBM's twenty replicates of
    10,000 people, and its cost does not grow with the population. The age grid
    sets fleet's cost, in proportion to its groups: on the 53 of
    default_age_lower(n_group = 53) fleet is 140x the IBM's speed.

- id: seed-stability
  figure: ~
  claim: An undisturbed run holds the equilibrium it was seeded at.
  criterion: PfPR(2-10) departs from its seeded value by less than 1% over 15 years at EIR 20
  tier: 1
  evidence: validations/01-seed-stability
  note: >
    The seed is malariaEquilibrium's continuous-time solution, not fleet's own
    fixed point on the daily clock, so the run moves off it and settles 0.26%
    below it. The claim is about prevalence: incidence relaxes further, under-5
    clinical incidence by -0.1% at EIR 1, +1.7% at EIR 20 and +6.0% at EIR 120,
    nine-tenths of it within five years, so a comparison of incidence levels
    wants a burn-in (every tier-2 scenario has thirty years), as the IBM's does.
    validations/01-seed-stability/run.R reproduces the prevalence figures.
  measured: 0.35% maximum excursion; flat to 0.008% over the last five years
  status: pass

# ---- P. vivax ------------------------------------------------------------------
# The same questions for a get_parameters(parasite = "vivax") list, from the
# vivax suite in validations/02-scenarios (CMP_PARASITE=pv): EIR 0.3 to 30, no
# severe disease, radical cure in place of chemoprevention and vaccines. The
# site-file comparison runs a vivax arm (CMP_PARASITE=pv in
# validations/03-real-settings) that is not in the register yet.

- id: prevalence-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_pvpr_2_10.png
  claim: LM prevalence in 2-10 year olds tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 1.8% of the IBM median, at EIR 3
  status: pass

- id: clinical-allage-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_clin_all.png
  claim: All-age clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 1.7% of the IBM median, at EIR 1
  status: pass
  note: >
    fleet sits 1.1 to 1.7% above the IBM median at every EIR from 1 up, a small
    offset of one sign, inside the band throughout. Part of it is the
    school-age excess of immunity sorting within cells, which fleet's one
    immunity distribution per cell does not carry (vignette("model", package =
    "fleet"), V.7).

- id: clinical-under5-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_clin_0_5.png
  claim: Under-5 clinical incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 1.9% of the IBM median, at EIR 0.3
  status: pass

- id: relapse-allage-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_relapse_all.png
  claim: All-age relapse incidence tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 3.2% of the IBM median, at
    EIR 0.3, and within 1.1% from EIR 1 up
  status: pass
  note: >
    Relapses are counted over everyone and divided by the 0-100 band's
    population, which in the IBM leaves out its 0.7% over 100 and in fleet
    holds everyone, so fleet reads about 0.7% low by construction; most of its
    shortfall from EIR 1 up is that. Dividing both by the whole population
    wants the IBM rows re-summarised, at the vivax suite's next IBM run.

- id: hypnozoite-carriage-eir-pv
  parasite: vivax
  figure: cmp_pv_eir_hyp_all.png
  claim: The share of people carrying hypnozoites tracks the IBM across transmission intensity.
  criterion: inside the IBM replicate band at every EIR on the grid
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 5 of 5; largest departure 3.1% of the IBM median, at
    EIR 0.3, and within 0.8% from EIR 1 up
  status: pass
  note: >
    At EIR 30 fleet is 0.76% below the IBM median, against a band 0.79% wide,
    and nearly all of that is the denominator of relapse-allage-eir-pv: carriage
    is counted over everyone and divided by the 0-100 band, which in the IBM
    leaves out the 0.7% over 100.

- id: age-profile-clinical-pv
  parasite: vivax
  figure: cmp_pv_age_clin.png
  claim: The age distribution of clinical incidence tracks the IBM.
  criterion: >
    inside the IBM replicate band in every age band carrying at least 5% of
    clinical episodes, at EIR 1, 3 and 10
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 23 of 23 tested bands across the three EIRs, holding 90%
    of episodes; largest departure 1.21 replicate SD, in the 3-5 y band at EIR 10
  status: pass
  note: >
    No untested band is outside either. fleet sits above the IBM median in most
    school-age bands, the offset of clinical-allage-eir-pv, where immunity
    sorting within cells leaves the mean field a little high (vignette("model",
    package = "fleet"), V.7).

- id: intervention-impact-pv
  parasite: vivax
  figure: cmp_pv_int_impact.png
  claim: The modelled impact of each intervention, radical cure included, matches the IBM.
  criterion: >
    outside the IBM replicate band in no greater a share of cells than the best
    held-out IBM replicate, over every intervention and outcome at EIR 1, 3 and 10
  tier: 2
  evidence: validations/02-scenarios
  measured: fleet outside in 26.7% of 60 cells, against 8.3% for the closest of
    the twenty IBM replicates and 24.2% for the median one
  status: fail
  note: >
    Twelve of the sixteen cells outside are indoor residual spraying, and there
    most of the distance is a defect in malariasimulation 3.0.0. The IBM
    evaluates vivax infections, relapses included, only on days when at least
    one person receives an infectious bite: simulate_infection() returns early
    on an empty bitten set, which is right for falciparum and wrong for a
    relapse, which needs no bite. Spraying makes days with no infectious bite
    across the whole 10,000-person population common, every relapse is lost on
    them, and the IBM eliminates vivax -- every replicate at EIR 1 and 3, 13 of
    20 at EIR 10 -- where fleet, relapsing every day, keeps it. The other four
    are bed nets at EIR 1, where the IBM's nets cut every outcome 6 to 9 points
    more than fleet's: nets kill mosquitoes as well as deflecting them, and at
    EIR 1 that leaves days with no infectious bite too. A patched copy of
    malariasimulation that evaluates relapses every day brought the IBM's
    reductions under spraying at EIR 3 and 10 and under nets at EIR 1 within 2.5
    points of fleet's, from up to 20 points away; that check was made against
    fleet's earlier, continuous-time model and is not yet reproduced by a
    script here. Without the spraying scenarios fleet is outside in 8.3% of 48
    cells, against 4.2% for the closest IBM replicate.
    Radical cure, by primaquine and by tafenoquine, agrees inside the band in
    every cell, as do treatment scale-up and bed nets at EIR 3 and 10.

- id: population-age-structure-pv
  parasite: vivax
  figure: cmp_pv_pop_age.png
  claim: The population age structure matches the IBM's.
  criterion: >
    inside the IBM replicate band in every age band below 60 years, on shares
    renormalised to the 0-60 population
  tier: 2
  evidence: validations/02-scenarios
  measured: inside at 11 of 11 at EIR 3; largest departure 2.1% of the IBM median
  status: pass
  note: >
    The vivax population ages and dies through compartments of its own, so its
    denominator is checked apart from falciparum's, under the same 0-60
    convention.

- id: speed-pv
  parasite: vivax
  figure: ~
  claim: fleet is fast enough to be worth using in place of the IBM.
  criterion: at least 10x faster than the IBM on the same scenario set
  tier: 2
  evidence: validations/02-scenarios
  measured: 0.41x on cost per simulated year; 9.5 CPU-hours for the IBM's 440
    runs against 69 minutes for fleet's 22
  status: fail
  note: >
    Per run, vivax fleet is the slower model: 3.9 s per simulated year against
    2.1 s for a 10,000-person IBM run, both on a shared worker pool. The
    hypnozoite dimension and the within-cell immunity spread make it about
    twenty times a falciparum fleet run on the same 209-group grid, while the IBM
    costs about the same for either parasite. One fleet run still stands in for
    the twenty IBM replicates the comparison needs, and fleet's cost does not
    grow with population, so the IBM arm here cost 8.3 times fleet's; but the
    criterion is per run, and per run fleet does not meet it. A 53-group grid
    runs about four times as fast.

- id: seed-stability-pv
  parasite: vivax
  figure: ~
  claim: An undisturbed run settles, a few per cent from the equilibrium it was seeded at.
  criterion: PvPR(2-10) flat to under 1% over the last five of 30 years, at EIR 0.3, 1, 3 and 10
  tier: 1
  evidence: validations/01-seed-stability
  measured: flat to 0.27% at EIR 0.3, 0.08% at 1, 0.007% at 3 and 0.001% at 10;
    settling 14%, 9%, 5% and 2% above the seeded PvPR
  status: pass
  note: >
    The criterion is settling rather than holding the seed, because the vivax
    seed is neither model's fixed point. malariaEquilibriumVivax solves each age,
    heterogeneity and batch cell with one immunity value, where both models
    build up a spread of immunity within a cell from the first day, and the
    vivax immunity curves are steep enough for that to move everything: over
    the four EIRs fleet's clinical incidence settles 15 to 21% above the seed
    and its realised EIR 4 to 17% above init_EIR, PvPR overshooting first at the
    lowest EIRs (20.7% at EIR 0.3). The IBM moves as far: in the tier-2 runs its
    realised EIR ends 18%, 13% and 8% above init_EIR at EIR 0.3, 1 and 3,
    against fleet's 17%, 13% and 9%. The control says why: with
    immunity_spread = FALSE fleet holds its seed at EIR 3 to within 1.3%. So
    every vivax comparison is made after a 30-year burn-in in both models --
    long enough at EIR 0.3, where settling takes over two decades -- and a vivax
    run started from set_equilibrium() wants one.
    validations/01-seed-stability/run.R reproduces the figures.

